name: Build Windows (x64)

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install platform deps
        run: bun install --frozen-lockfile

      - name: Build for Windows x64
        run: |
          cd packages/opencode
          bun run build --skip-install
        env:
          OPENCODE_CHANNEL: "release"

      - name: Upload Windows x64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-x64
          path: packages/opencode/dist/opencode-windows-x64/bin/
          if-no-files-found: error

      - name: Upload Windows arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: opencode-windows-arm64
          path: packages/opencode/dist/opencode-windows-arm64/bin/
          if-no-files-found: ignore
