name: Publish to npm

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build all platforms
        run: |
          cd packages/opencode
          bun run build
        env:
          OPENCODE_CHANNEL: "release"

      - name: Create npm root package
        run: |
          cd packages/opencode
          node script/create-npm-packages.cjs

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Publish platform packages
        run: |
          cd packages/opencode/dist
          for dir in */; do
            if [ -f "$dir/package.json" ]; then
              echo "Publishing $dir ..."
              cd "$dir"
              npm publish --access public 2>&1 || echo "⚠️ $dir publish skipped (may already exist)"
              cd ..
            fi
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish root forge-code package
        run: |
          cd packages/opencode
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Upload binaries as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-code-all-platforms
          path: packages/opencode/dist/*/bin/
